<text x="1115" y="305" text-anchor="middle" font-size="9.5" fill="#7A8FA0" font-weight="normal" font-style="italic" font-family="Arial,Helvetica,sans-serif">Stress → parasympathetic drop → DC↓</text>
<text x="1115" y="322" text-anchor="middle" font-size="10" fill="#3D4C59" font-weight="bold" font-style="normal" font-family="Arial,Helvetica,sans-serif">Output: REST or STRESS flag</text>
