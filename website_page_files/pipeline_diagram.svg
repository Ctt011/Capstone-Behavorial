<text x="385" y="305" text-anchor="middle" font-size="9.5" fill="#7A8FA0" font-weight="normal" font-style="italic" font-family="Arial,Helvetica,sans-serif">93.6% LOSO · 22-fold LOSOCV</text>
<text x="385" y="322" text-anchor="middle" font-size="10" fill="#3D4C59" font-weight="bold" font-style="normal" font-family="Arial,Helvetica,sans-serif">Output: PHYSICAL or COGNITIVE</text>
