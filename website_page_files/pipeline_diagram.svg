<text x="62.5" y="660.0" text-anchor="start" font-size="10" fill="#3D4C59" font-weight="normal" font-style="normal" font-family="Arial,Helvetica,sans-serif">Movement (ACC) is the #1 differentiator, not HR</text>
<text x="40.5" y="688.0" text-anchor="start" font-size="10" fill="#3D8B6E" font-weight="bold" font-style="normal" font-family="Arial,Helvetica,sans-serif">2.</text>
<text x="62.5" y="688.0" text-anchor="start" font-size="10" fill="#3D4C59" font-weight="normal" font-style="normal" font-family="Arial,Helvetica,sans-serif">HR alone cannot separate aerobic from anaerobic</text>
<text x="40.5" y="716.0" text-anchor="start" font-size="10" fill="#3D8B6E" font-weight="bold" font-style="normal" font-family="Arial,Helvetica,sans-serif">3.</text>
<text x="62.5" y="716.0" text-anchor="start" font-size="10" fill="#3D4C59" font-weight="normal" font-style="normal" font-family="Arial,Helvetica,sans-serif">Without Stage 1, exercise misclassified as stress</text>
<text x="40.5" y="744.0" text-anchor="start" font-size="10" fill="#3D8B6E" font-weight="bold" font-style="normal" font-family="Arial,Helvetica,sans-serif">4.</text>
<text x="62.5" y="744.0" text-anchor="start" font-size="10" fill="#3D4C59" font-weight="normal" font-style="normal" font-family="Arial,Helvetica,sans-serif">Sleep quality (Stage 2) shifts threshold — no retraining</text>
