name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (Stage 2 & Stage 3 — no dataset required)
        run: |
          pytest tests/test_stage2_sleep_rules.py tests/test_stage3_stress_formulas.py -v --tb=short

      - name: Run preprocessing tests (skipped if dataset unavailable)
        run: |
          pytest tests/test_preprocessing.py -v --tb=short || true
